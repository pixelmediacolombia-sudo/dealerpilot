    get:
      operationId: getVehicleIntelligence
      summary: Intelligence for a single vehicle
      tags: [MarketplaceIntelligence]
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vehicle intelligence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleIntelligenceResponse"

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: Status of all 6 scheduled AI workers
      responses:
        "200":
          description: Worker statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatusList"

  /workers/{id}/run:
    post:
      operationId: runWorkerNow
      tags: [workers]
      summary: Manually trigger a worker to run immediately
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Worker run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerRunResult"
        "404":
          description: Unknown worker id

  /workers/timeline:
    get:
      operationId: getSystemTimeline
      tags: [workers]
      summary: Recent System Timeline events emitted by workers
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: System Timeline events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemTimelineEventList"

  /orchestrator/status:
    get:
      operationId: getOrchestratorStatus
      tags: [orchestrator]
      summary: Current AI Orchestrator status and last decision
      responses:
        "200":
          description: Orchestrator status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestratorStatus"

  /orchestrator/run:
    post:
      operationId: runOrchestratorCycle
      tags: [orchestrator]
      summary: Manually run one orchestration cycle
      responses:
        "200":
          description: Orchestration cycle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestrationCycleResult"

components:
  schemas:
    WorkerStatus:
      type: object
      required: [id, name, description, intervalMs, enabled, status, lastRunAt, nextRunAt, lastResult, lastError]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        intervalMs: { type: integer }
        enabled: { type: boolean }
        status:
          type: string
          enum: [Online, Sleeping, Failed]
        lastRunAt: { type: ["string", "null"], format: date-time }
        nextRunAt: { type: ["string", "null"], format: date-time }
        lastResult: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }

    WorkerStatusList:
      type: object
      required:
        [
          workers,
          todayOpenAISpendEstimate,
          todayFALSpendEstimate,
          openAIBudgetRemaining,
          falBudgetRemaining,
          photoWorkerStatus,
        ]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerStatus"
        todayOpenAISpendEstimate:
          type: number
          description: Estimated USD spent today on OpenAI photo classification calls (real per-call counter).
        todayFALSpendEstimate:
          type: number
          description: Estimated USD spent today on FAL background removal/enhancement jobs (real per-call counter).
        openAIBudgetRemaining:
          type: number
          description: Remaining USD budget today under WORKER_DAILY_OPENAI_BUDGET_USD.
        falBudgetRemaining:
          type: number
          description: Remaining USD budget today under WORKER_DAILY_FAL_BUDGET_USD.
        photoWorkerStatus:
          type: string
          enum: [Running, "Paused (Budget)", "Paused (No Vehicles)", Sleeping]
          description: Detailed runtime status of the Photo Worker, distinguishing budget pauses from no-work pauses.

    WorkerRunResult:
      type: object
      required: [workerId, summary, skipped]
      properties:
        workerId: { type: string }
        summary: { type: string }
        skipped: { type: boolean }
        detail: {}

    WorkerDecision:
      type: object
      required: [workerId, action, reason]
      properties:
        workerId: { type: string }
        action:
          type: string
          enum: [RUN, SKIP, PAUSE]
        reason: { type: string }
        budgetStatus: { type: string }
        dependencyStatus: { type: string }

    OrchestratorBudgetStatus:
      type: object
      required:
        [
          todayFALSpendEstimate,
          falBudgetRemaining,
          falDailyBudgetUsd,
          todayOpenAISpendEstimate,
          openAIBudgetRemaining,
          openAIDailyBudgetUsd,
        ]
      properties:
        todayFALSpendEstimate: { type: number }
        falBudgetRemaining: { type: number }
        falDailyBudgetUsd: { type: number }
        todayOpenAISpendEstimate: { type: number }
        openAIBudgetRemaining: { type: number }
        openAIDailyBudgetUsd: { type: number }

    OrchestratorStatus:
      type: object
      required:
        [
          status,
          lastDecisionAt,
          decisions,
          workersRunning,
          workersSkipped,
          workersPaused,
          budgetStatus,
          extensionOnline,
        ]
      properties:
        status:
          type: string
          enum: [Active, Failed, Sleeping]
        lastDecisionAt: { type: ["string", "null"], format: date-time }
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/WorkerDecision"
        workersRunning:
          type: array
          items: { type: string }
        workersSkipped:
          type: array
          items: { type: string }
        workersPaused:
          type: array
          items: { type: string }
        budgetStatus:
          $ref: "#/components/schemas/OrchestratorBudgetStatus"
        extensionOnline: { type: boolean }

    OrchestrationCycleResult:
      type: object
      required: [status, decisions, ranWorkerIds, skippedWorkerIds, pausedWorkerIds]
      properties:
        status:
          type: string
          enum: [Active, Failed]
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/WorkerDecision"
        ranWorkerIds:
          type: array
          items: { type: string }
        skippedWorkerIds:
          type: array
          items: { type: string }
        pausedWorkerIds:
          type: array
          items: { type: string }

    SystemTimelineEvent:
      type: object
      required: [id, category, workerId, message, createdAt]
      properties:
        id: { type: integer }
        category: { type: string }
        workerId: { type: ["string", "null"] }
        message: { type: string }
        detail: {}
        createdAt: { type: string, format: date-time }

    SystemTimelineEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SystemTimelineEvent"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Dealer:
      type: object
      required: [id, name, plan, status, totalVehiclesImported, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        websiteUrl: { type: ["string", "null"] }
        xmlFeedUrl: { type: ["string", "null"] }
        plan: { type: string, enum: [basic, complete], default: complete }
        status: { type: string }
        notes: { type: ["string", "null"] }
        lastSyncAt: { type: ["string", "null"] }
        lastSyncStatus: { type: ["string", "null"] }
        totalVehiclesImported: { type: integer }
        lastError: { type: ["string", "null"] }
        createdAt: { type: string }
    DealerList:
      type: object
      required: [dealers]
      properties:
        dealers:
          type: array
          items:
            $ref: "#/components/schemas/Dealer"
    DealerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        websiteUrl: { type: string }
        xmlFeedUrl: { type: string }
        plan: { type: string, enum: [basic, complete] }
        status: { type: string }
        notes: { type: string }

    FeedRun:
      type: object
      required:
        [
          id,
          dealerId,
          status,
          startedAt,
          vehiclesImported,
          vehiclesNew,
          vehiclesUpdated,
          vehiclesRemoved,
          vehiclesActive,
          errorCount,
        ]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        vehiclesImported: { type: integer }
        vehiclesNew: { type: integer }
        vehiclesUpdated: { type: integer }
        vehiclesRemoved: { type: integer }
        vehiclesActive: { type: integer }
        errorCount: { type: integer }
        errorMessage: { type: ["string", "null"] }
    FeedRunList:
      type: object
      required: [feedRuns]
      properties:
        feedRuns:
          type: array
          items:
            $ref: "#/components/schemas/FeedRun"

    Vehicle:
      type: object
      required:
        [id, dealerId, vin, year, make, model, status, imageCount, marketplaceListingUrl, marketplaceListingStatus, marketplaceRemovalRequired, createdAt, updatedAt]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        vin: { type: string }
        stockNumber: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        mileage: { type: ["integer", "null"] }
        price: { type: ["integer", "null"] }
        exteriorColor: { type: ["string", "null"] }
        interiorColor: { type: ["string", "null"] }
        bodyStyle: { type: ["string", "null"] }
        transmission: { type: ["string", "null"] }
        fuelType: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        vdpUrl: { type: ["string", "null"] }
        status: { type: string }
        primaryImageUrl: { type: ["string", "null"] }
        imageCount: { type: integer }
        marketplaceListingUrl:
          type: ["string", "null"]
          description: Facebook Marketplace listing URL previously captured for this vehicle.
        marketplaceListingStatus:
          type: ["string", "null"]
          description: DealerPilot's current Marketplace lifecycle status for this vehicle.
        marketplaceRemovalRequired:
          type: boolean
          description: True when the vehicle is sold and its captured Marketplace listing still requires removal.
        lastSyncAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    VehicleList:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
    VehicleImage:
      type: object
      required: [id, url, position, isPrimary]
      properties:
        id: { type: integer }
        url: { type: string }
        position: { type: integer }
        category: { type: ["string", "null"] }
        isPrimary: { type: boolean }
    VehicleChange:
      type: object
      required: [id, changeType, createdAt]
      properties:
        id: { type: integer }
        changeType: { type: string }
        field: { type: ["string", "null"] }
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        createdAt: { type: string }
    VehicleDetail:
      type: object
      required: [vehicle, images, changes]
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        images:
          type: array
          items:
            $ref: "#/components/schemas/VehicleImage"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleChange"
        sourceRaw: { type: ["string", "null"] }
    BulkVehicleActionRequest:
      type: object
      required: [vehicleIds, action]
      properties:
        vehicleIds:
          type: array
          items: { type: integer }
        action:
          type: string
          enum: [mark_ready, mark_sold, archive, mark_new]
    BulkScheduleRequest:
      type: object
      required: [vehicleIds]
      properties:
        vehicleIds:
          type: array
          items: { type: integer }
        scheduledAt: { type: string }
        spacingMinutes: { type: integer }
        priority: { type: integer }
        notes: { type: string }
        gmOverrides:
          type: array
          items: { type: integer }
          description: Vehicle IDs the operator has explicitly acknowledged a HOLD/RECONSIDER decision for and is overriding
    BulkCreativeGenerateRequest:
      type: object
      required: [vehicleIds]
      properties:
        vehicleIds:
          type: array
          items: { type: integer }
        templateKey: { type: string }
    VehicleStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }
    VehicleStats:
      type: object
      required:
        [total, active, new, readyToPublish, published, soldRemoved, priceChanged, noLot]
      properties:
        total: { type: integer }
        active: { type: integer }
        new: { type: integer }
        readyToPublish: { type: integer }
        published: { type: integer }
        soldRemoved: { type: integer }
        priceChanged: { type: integer }
        noLot: { type: integer, description: "Vehicles with null or unmapped lot location (cannot be published)" }

    ServiceStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
        detail: { type: ["string", "null"] }
        lastHeartbeatAt: { type: ["string", "null"] }
        backendUrl: { type: ["string", "null"] }
    ConnectionStatus:
      type: object
      required:
        [
          backend,
          database,
          xmlFeed,
          chromeExtension,
          facebookSession,
          marketplace,
          messenger,
          openai,
          overallConnected,
          extensionOnline,
        ]
      properties:
        backend: { $ref: "#/components/schemas/ServiceStatus" }
        database: { $ref: "#/components/schemas/ServiceStatus" }
        xmlFeed: { $ref: "#/components/schemas/ServiceStatus" }
        chromeExtension: { $ref: "#/components/schemas/ServiceStatus" }
        facebookSession:
          allOf:
            - $ref: "#/components/schemas/ServiceStatus"
            - type: object
              properties:
                fbLoggedIn: { type: ["boolean", "null"] }
        marketplace:
          allOf:
            - $ref: "#/components/schemas/ServiceStatus"
            - type: object
              properties:
                marketplaceConnected: { type: ["boolean", "null"] }
        messenger: { $ref: "#/components/schemas/ServiceStatus" }
        openai: { $ref: "#/components/schemas/ServiceStatus" }
        overallConnected: { type: boolean }
        extensionOnline: { type: boolean }
        connectRequestedAt: { type: ["string", "null"] }

    ExtensionConnection:
      type: object
      required: [id, name, status, lastHeartbeatAt]
      properties:
        id: { type: integer }
        name: { type: string }
        backendUrl: { type: ["string", "null"] }
        status: { type: string }
        lastHeartbeatAt: { type: ["string", "null"] }
        fbLoggedIn: { type: ["boolean", "null"] }
        marketplaceConnected: { type: ["boolean", "null"] }

    HeartbeatInput:
      type: object
      properties:
        backendUrl: { type: string }
        status: { type: string }
        fbLoggedIn: { type: ["boolean", "null"] }
        marketplaceConnected: { type: ["boolean", "null"] }

    ConnectMarketplaceInput:
      type: object
      properties:
        action:
          type: string
          enum: [marketplace, login]
          default: marketplace

    ConnectMarketplaceResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        connectRequestedAt: { type: ["string", "null"] }

    ExtensionConnectStatus:
      type: object
      required: [connectRequested]
      properties:
        connectRequested: { type: boolean }
        connectAction: { type: ["string", "null"] }
        fbLoggedIn: { type: ["boolean", "null"] }
        marketplaceConnected: { type: ["boolean", "null"] }

    SessionReportInput:
      type: object
      required: [fbLoggedIn, marketplaceConnected]
      properties:
        extensionId: { type: string }
        fbLoggedIn: { type: boolean }
        marketplaceConnected: { type: boolean }

    SessionReportResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        fbLoggedIn: { type: ["boolean", "null"] }
        marketplaceConnected: { type: ["boolean", "null"] }

    TestListing:
      type: object
      required: [title, year, make, model, price, downPayment, mileage, description]
      properties:
        title: { type: string }
        year: { type: integer }
        make: { type: string }
        model: { type: string }
        price: { type: integer }
        downPayment: { type: integer }
        mileage: { type: integer }
        description: { type: string }
    MessageContextInput:
      type: object
      required: [chatText]
      properties:
        chatText: { type: string, minLength: 1 }
        buyerName: { type: string }
        sourceUrl: { type: string }
    MessageContextResult:
      type: object
      required: [suggestedReply, lead]
      properties:
        suggestedReply: { type: string }
        lead: { $ref: "#/components/schemas/Lead" }
    LeadList:
      type: object
      required: [leads]
      properties:
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"

    ListingScore:
      type: object
      required:
