openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: extension
    description: Chrome extension spike endpoints
  - name: dealers
    description: Dealer setup and feed configuration
  - name: inventory
    description: Vehicle inventory
  - name: connection
    description: Connection center status
  - name: listings
    description: Listing Intelligence Engine
  - name: publishing
    description: Publishing queue and jobs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dealers:
    get:
      operationId: listDealers
      tags: [dealers]
      summary: List dealers
      responses:
        "200":
          description: List of dealers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerList"
  /dealers/{id}:
    get:
      operationId: getDealer
      tags: [dealers]
      summary: Get a dealer with feed summary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The dealer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDealer
      tags: [dealers]
      summary: Update dealer fields (incl. XML feed URL)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerUpdate"
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
  /dealers/{id}/sync:
    post:
      operationId: syncDealerFeed
      tags: [dealers]
      summary: Sync the dealer's XML feed (parse, import, delta-detect)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feed run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRun"
        "400":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRun"
  /dealers/{id}/feed-runs:
    get:
      operationId: listFeedRuns
      tags: [dealers]
      summary: List recent feed runs for a dealer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feed runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRunList"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [inventory]
      summary: List vehicles with search, filter, and sort
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by VIN, stock number, make, or model
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by vehicle status
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, price_high, price_low, mileage_low]
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleList"
  /vehicles/stats:
    get:
      operationId: getVehicleStats
      tags: [inventory]
      summary: Inventory counts by status
      responses:
        "200":
          description: Inventory stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStats"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [inventory]
      summary: Vehicle detail with images, changes, and raw data
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vehicles/{id}/status:
    patch:
      operationId: updateVehicleStatus
      tags: [inventory]
      summary: Update a vehicle's status (e.g. Ready to Publish, Archived)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleStatusUpdate"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /connection-center:
    get:
      operationId: getConnectionStatus
      tags: [connection]
      summary: Status of all integrations and services
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"

  /extension/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [extension]
      summary: Record an extension heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionConnection"
  /extension/test-listing:
    get:
      operationId: getTestListing
      tags: [extension]
      summary: Get the test vehicle listing
      description: Returns the static test listing the Chrome extension fills into Marketplace.
      responses:
        "200":
          description: The test listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestListing"
  /extension/message-context:
    post:
      operationId: createMessageContext
      tags: [extension]
      summary: Submit Messenger chat text and get an AI-style reply
      description: Receives visible Messenger chat text, returns a suggested reply, and saves a test lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageContextInput"
      responses:
        "200":
          description: Suggested reply and saved lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageContextResult"
  /extension/leads:
    get:
      operationId: getLeads
      tags: [extension]
      summary: List saved test leads
      description: Returns all saved test leads, newest first.
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"

  /listings:
    get:
      operationId: listListingWorkspaces
      tags: [listings]
      summary: List one Listing Workspace per vehicle
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by VIN, stock number, make, or model
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by draft/listing status
      responses:
        "200":
          description: Listing workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingWorkspaceList"
  /listings/{id}:
    get:
      operationId: getListingDetail
      tags: [listings]
      summary: Listing detail for a vehicle (current version, all versions, history)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Vehicle id
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listings/{id}/generate:
    post:
      operationId: generateListing
      tags: [listings]
      summary: Generate a new AI listing version for a vehicle (never overwrites)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Vehicle id
      responses:
        "200":
          description: Newly generated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}:
    patch:
      operationId: updateListingVersion
      tags: [listings]
      summary: Edit fields of a listing version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionUpdate"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}/status:
    patch:
      operationId: updateListingVersionStatus
      tags: [listings]
      summary: Move a listing version through its lifecycle (Draft, Ready for Review, Approved)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionStatusUpdate"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}/queue:
    post:
      operationId: queueListingVersion
      tags: [publishing]
      summary: Approve and queue a listing version for publishing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueListingInput"
      responses:
        "200":
          description: Created publishing job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publishing/jobs:
    get:
      operationId: listPublishingJobs
      tags: [publishing]
      summary: List publishing jobs for the queue UI
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by job status
      responses:
        "200":
          description: Publishing jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobList"
  /publishing/jobs/next:
    get:
      operationId: getNextPublishingJob
      tags: [publishing]
      summary: Get the next claimable publishing job (for the Chrome extension)
      responses:
        "200":
          description: Next job, or null when the queue is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextPublishingJob"
  /publishing/jobs/{id}/claim:
    post:
      operationId: claimPublishingJob
      tags: [publishing]
      summary: Claim a job for an extension instance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobInput"
      responses:
        "200":
          description: Claimed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /publishing/jobs/{id}/complete:
    post:
      operationId: completePublishingJob
      tags: [publishing]
      summary: Mark a job published
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Completed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /publishing/jobs/{id}/fail:
    post:
      operationId: failPublishingJob
      tags: [publishing]
      summary: Mark a job failed (eligible for retry)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobInput"
      responses:
        "200":
          description: Failed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Dealer:
      type: object
      required: [id, name, status, totalVehiclesImported, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        websiteUrl: { type: ["string", "null"] }
        xmlFeedUrl: { type: ["string", "null"] }
        status: { type: string }
        notes: { type: ["string", "null"] }
        lastSyncAt: { type: ["string", "null"] }
        lastSyncStatus: { type: ["string", "null"] }
        totalVehiclesImported: { type: integer }
        lastError: { type: ["string", "null"] }
        createdAt: { type: string }
    DealerList:
      type: object
      required: [dealers]
      properties:
        dealers:
          type: array
          items:
            $ref: "#/components/schemas/Dealer"
    DealerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        websiteUrl: { type: string }
        xmlFeedUrl: { type: string }
        status: { type: string }
        notes: { type: string }

    FeedRun:
      type: object
      required:
        [
          id,
          dealerId,
          status,
          startedAt,
          vehiclesImported,
          vehiclesNew,
          vehiclesUpdated,
          vehiclesRemoved,
          vehiclesActive,
          errorCount,
        ]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        status: { type: string }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        vehiclesImported: { type: integer }
        vehiclesNew: { type: integer }
        vehiclesUpdated: { type: integer }
        vehiclesRemoved: { type: integer }
        vehiclesActive: { type: integer }
        errorCount: { type: integer }
        errorMessage: { type: ["string", "null"] }
    FeedRunList:
      type: object
      required: [feedRuns]
      properties:
        feedRuns:
          type: array
          items:
            $ref: "#/components/schemas/FeedRun"

    Vehicle:
      type: object
      required:
        [id, dealerId, vin, year, make, model, status, imageCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        dealerId: { type: integer }
        vin: { type: string }
        stockNumber: { type: ["string", "null"] }
        year: { type: ["integer", "null"] }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        mileage: { type: ["integer", "null"] }
        price: { type: ["integer", "null"] }
        exteriorColor: { type: ["string", "null"] }
        interiorColor: { type: ["string", "null"] }
        bodyStyle: { type: ["string", "null"] }
        transmission: { type: ["string", "null"] }
        fuelType: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        vdpUrl: { type: ["string", "null"] }
        status: { type: string }
        primaryImageUrl: { type: ["string", "null"] }
        imageCount: { type: integer }
        lastSyncAt: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    VehicleList:
      type: object
      required: [vehicles]
      properties:
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/Vehicle"
    VehicleImage:
      type: object
      required: [id, url, position]
      properties:
        id: { type: integer }
        url: { type: string }
        position: { type: integer }
    VehicleChange:
      type: object
      required: [id, changeType, createdAt]
      properties:
        id: { type: integer }
        changeType: { type: string }
        field: { type: ["string", "null"] }
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        createdAt: { type: string }
    VehicleDetail:
      type: object
      required: [vehicle, images, changes]
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        images:
          type: array
          items:
            $ref: "#/components/schemas/VehicleImage"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleChange"
        sourceRaw: { type: ["string", "null"] }
    VehicleStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }
    VehicleStats:
      type: object
      required:
        [total, active, new, readyToPublish, published, soldRemoved, priceChanged]
      properties:
        total: { type: integer }
        active: { type: integer }
        new: { type: integer }
        readyToPublish: { type: integer }
        published: { type: integer }
        soldRemoved: { type: integer }
        priceChanged: { type: integer }

    ServiceStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
        detail: { type: ["string", "null"] }
        lastHeartbeatAt: { type: ["string", "null"] }
        backendUrl: { type: ["string", "null"] }
    ConnectionStatus:
      type: object
      required:
        [
          backend,
          database,
          xmlFeed,
          chromeExtension,
          facebookSession,
          marketplace,
          messenger,
          openai,
        ]
      properties:
        backend: { $ref: "#/components/schemas/ServiceStatus" }
        database: { $ref: "#/components/schemas/ServiceStatus" }
        xmlFeed: { $ref: "#/components/schemas/ServiceStatus" }
        chromeExtension: { $ref: "#/components/schemas/ServiceStatus" }
        facebookSession: { $ref: "#/components/schemas/ServiceStatus" }
        marketplace: { $ref: "#/components/schemas/ServiceStatus" }
        messenger: { $ref: "#/components/schemas/ServiceStatus" }
        openai: { $ref: "#/components/schemas/ServiceStatus" }

    ExtensionConnection:
      type: object
      required: [id, name, status, lastHeartbeatAt]
      properties:
        id: { type: integer }
        name: { type: string }
        backendUrl: { type: ["string", "null"] }
        status: { type: string }
        lastHeartbeatAt: { type: ["string", "null"] }
    HeartbeatInput:
      type: object
      properties:
        backendUrl: { type: string }
        status: { type: string }

    TestListing:
      type: object
      required: [title, year, make, model, price, downPayment, mileage, description]
      properties:
        title: { type: string }
        year: { type: integer }
        make: { type: string }
        model: { type: string }
        price: { type: integer }
        downPayment: { type: integer }
        mileage: { type: integer }
        description: { type: string }
    MessageContextInput:
      type: object
      required: [chatText]
      properties:
        chatText: { type: string, minLength: 1 }
        buyerName: { type: string }
        sourceUrl: { type: string }
    Lead:
      type: object
      required: [id, messageText, status, createdAt]
      properties:
        id: { type: integer }
        buyerName: { type: ["string", "null"] }
        messageText: { type: string }
        suggestedReply: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string }
    MessageContextResult:
      type: object
      required: [suggestedReply, lead]
      properties:
        suggestedReply: { type: string }
        lead: { $ref: "#/components/schemas/Lead" }
    LeadList:
      type: object
      required: [leads]
      properties:
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"

    ListingScore:
      type: object
      required:
        [
          id,
          listingVersionId,
          vehicleId,
          titleQuality,
          descriptionQuality,
          priceStrategy,
          downPaymentStrategy,
          photoScore,
          overall,
          rating,
          createdAt,
        ]
      properties:
        id: { type: integer }
        listingVersionId: { type: integer }
        vehicleId: { type: integer }
        titleQuality: { type: integer }
        descriptionQuality: { type: integer }
        priceStrategy: { type: integer }
        downPaymentStrategy: { type: integer }
        photoScore: { type: integer }
        overall: { type: integer }
        rating: { type: string }
        createdAt: { type: string }
    ListingVersion:
      type: object
      required:
        [
          id,
          vehicleId,
          dealerId,
          version,
          title,
          language,
          status,
          generatedBy,
          isCurrent,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        dealerId: { type: integer }
        version: { type: integer }
        title: { type: string }
        descriptionEn: { type: ["string", "null"] }
        descriptionEs: { type: ["string", "null"] }
        language: { type: string }
        askingPrice: { type: ["integer", "null"] }
        downPayment: { type: ["integer", "null"] }
        callToAction: { type: ["string", "null"] }
        buyerProfile: { type: ["string", "null"] }
        priority: { type: ["string", "null"] }
        status: { type: string }
        generatedBy: { type: string }
        isCurrent: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
        score:
          oneOf:
            - $ref: "#/components/schemas/ListingScore"
            - type: "null"
    ListingVersionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        descriptionEn: { type: string }
        descriptionEs: { type: string }
        language: { type: string }
        askingPrice: { type: integer }
        downPayment: { type: integer }
        callToAction: { type: string }
        buyerProfile: { type: string }
        priority: { type: string }
    ListingVersionStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }
    ListingWorkspace:
      type: object
      required:
        [
          vehicleId,
          dealerId,
          label,
          make,
          model,
          status,
          versionCount,
          aiStatus,
          publishStatus,
          priorityScore,
          imageCount,
        ]
      properties:
        vehicleId: { type: integer }
        dealerId: { type: integer }
        label: { type: string }
        vin: { type: string }
        year: { type: ["integer", "null"] }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        bodyStyle: { type: ["string", "null"] }
        price: { type: ["integer", "null"] }
        primaryImageUrl: { type: ["string", "null"] }
        imageCount: { type: integer }
        status: { type: string }
        versionCount: { type: integer }
        currentVersion: { type: ["integer", "null"] }
        aiStatus: { type: string }
        publishStatus: { type: string }
        priorityScore: { type: integer }
        listingScore: { type: ["integer", "null"] }
        listingRating: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
    ListingWorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/ListingWorkspace"
    ListingDetail:
      type: object
      required: [vehicle, versions, jobs]
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        images:
          type: array
          items:
            $ref: "#/components/schemas/VehicleImage"
        currentVersion:
          oneOf:
            - $ref: "#/components/schemas/ListingVersion"
            - type: "null"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ListingVersion"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PublishingJob"
        priorityScore: { type: integer }

    PublishingJob:
      type: object
      required:
        [
          id,
          listingVersionId,
          vehicleId,
          dealerId,
          status,
          priority,
          attempts,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        listingVersionId: { type: integer }
        vehicleId: { type: integer }
        dealerId: { type: integer }
        status: { type: string }
        priority: { type: integer }
        scheduledAt: { type: ["string", "null"] }
        claimedByExtension: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        failedReason: { type: ["string", "null"] }
        attempts: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        vehicleLabel: { type: ["string", "null"] }
        dealerName: { type: ["string", "null"] }
        listingTitle: { type: ["string", "null"] }
    PublishingJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PublishingJob"
    NextPublishingJob:
      type: object
      required: [job]
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/PublishingJob"
            - type: "null"
    QueueListingInput:
      type: object
      properties:
        scheduledAt: { type: string }
        priority: { type: integer }
    ClaimJobInput:
      type: object
      required: [extensionId]
      properties:
        extensionId: { type: string, minLength: 1 }
    FailJobInput:
      type: object
      properties:
        reason: { type: string }
