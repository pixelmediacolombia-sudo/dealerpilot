      properties:
        id: { type: integer }
        listingVersionId: { type: integer }
        vehicleId: { type: integer }
        titleQuality: { type: integer }
        descriptionQuality: { type: integer }
        priceStrategy: { type: integer }
        downPaymentStrategy: { type: integer }
        photoScore: { type: integer }
        overall: { type: integer }
        rating: { type: string }
        createdAt: { type: string }
    ListingVersion:
      type: object
      required:
        [
          id,
          vehicleId,
          dealerId,
          version,
          title,
          language,
          status,
          generatedBy,
          isCurrent,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        dealerId: { type: integer }
        version: { type: integer }
        title: { type: string }
        descriptionEn: { type: ["string", "null"] }
        descriptionEs: { type: ["string", "null"] }
        language: { type: string }
        askingPrice: { type: ["integer", "null"] }
        downPayment: { type: ["integer", "null"] }
        callToAction: { type: ["string", "null"] }
        buyerProfile: { type: ["string", "null"] }
        copyAngle: { type: ["string", "null"] }
        priority: { type: ["string", "null"] }
        status: { type: string }
        generatedBy: { type: string }
        isCurrent: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
        score:
          oneOf:
            - $ref: "#/components/schemas/ListingScore"
            - type: "null"
    ListingVersionUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        descriptionEn: { type: string }
        descriptionEs: { type: string }
        language: { type: string }
        askingPrice: { type: integer }
        downPayment: { type: integer }
        callToAction: { type: string }
        buyerProfile: { type: string }
        priority: { type: string }
    ListingVersionStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, minLength: 1 }
    ListingWorkspace:
      type: object
      required:
        [
          vehicleId,
          dealerId,
          label,
          make,
          model,
          status,
          versionCount,
          aiStatus,
          publishStatus,
          priorityScore,
          imageCount,
        ]
      properties:
        vehicleId: { type: integer }
        dealerId: { type: integer }
        label: { type: string }
        vin: { type: string }
        year: { type: ["integer", "null"] }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        bodyStyle: { type: ["string", "null"] }
        price: { type: ["integer", "null"] }
        downPayment: { type: ["integer", "null"] }
        primaryImageUrl: { type: ["string", "null"] }
        imageCount: { type: integer }
        status: { type: string }
        vehicleStatus: { type: string }
        versionCount: { type: integer }
        currentVersion: { type: ["integer", "null"] }
        aiStatus: { type: string }
        publishStatus: { type: string }
        priorityScore: { type: integer }
        listingScore: { type: ["integer", "null"] }
        listingRating: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        marketplaceUrl: { type: ["string", "null"] }
        messageCount: { type: integer }
        leadCount: { type: integer }
        engagementStatus: { type: ["string", "null"] }
        recommendation: { type: ["string", "null"] }
        daysLive: { type: integer }
    ListingWorkspaceList:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/ListingWorkspace"
    ListingDetail:
      type: object
      required: [vehicle, versions, jobs]
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        images:
          type: array
          items:
            $ref: "#/components/schemas/VehicleImage"
        currentVersion:
          oneOf:
            - $ref: "#/components/schemas/ListingVersion"
            - type: "null"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ListingVersion"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PublishingJob"
        priorityScore: { type: integer }

    PublishingJob:
      type: object
      required:
        [
          id,
          listingVersionId,
          vehicleId,
          dealerId,
          status,
          priority,
          attempts,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        listingVersionId: { type: integer }
        vehicleId: { type: integer }
        dealerId: { type: integer }
        status: { type: string }
        priority: { type: integer }
        scheduledAt: { type: ["string", "null"] }
        claimedByExtension: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        failedReason: { type: ["string", "null"] }
        attempts: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        vehicleLabel: { type: ["string", "null"] }
        dealerName: { type: ["string", "null"] }
        listingTitle: { type: ["string", "null"] }
        listingUrl: { type: ["string", "null"] }
    PublishingJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PublishingJob"
    NextPublishingJob:
      type: object
      required: [job]
      properties:
        job:
          oneOf:
            - $ref: "#/components/schemas/PublishingJob"
            - type: "null"
    PublishingJobFill:
      type: object
      required: [title, make, model, vin, category]
      properties:
        title: { type: string }
        price: { type: ["integer", "null"] }
        description: { type: string }
        descriptionEs: { type: ["string", "null"] }
        mileage: { type: ["integer", "null"] }
        year: { type: ["integer", "null"] }
        make: { type: string }
        model: { type: string }
        trim: { type: ["string", "null"] }
        vin: { type: string }
        bodyStyle: { type: ["string", "null"] }
        exteriorColor: { type: ["string", "null"] }
        fuelType: { type: ["string", "null"] }
        transmission: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        category: { type: string }
        downPayment: { type: ["integer", "null"] }
        actualVehiclePrice: { type: ["integer", "null"] }
        marketplaceDisplayedPrice: { type: ["integer", "null"] }
        priceMode: { type: ["string", "null"], enum: [FULL_PRICE, DOWN_PAYMENT, "null"] }
        recommendedDownPayment: { type: ["integer", "null"] }
        pricingReason: { type: ["string", "null"] }
    PublishingJobPayload:
      type: object
      required: [job, fill, images]
      properties:
        job:
          $ref: "#/components/schemas/PublishingJob"
        fill:
          $ref: "#/components/schemas/PublishingJobFill"
        images:
          type: array
          items: { type: string }
    QueueListingInput:
