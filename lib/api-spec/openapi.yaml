openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: extension
    description: Chrome extension spike endpoints
  - name: dealers
    description: Dealer setup and feed configuration
  - name: inventory
    description: Vehicle inventory
  - name: connection
    description: Connection center status
  - name: listings
    description: Listing Intelligence Engine
  - name: publishing
    description: Publishing queue and jobs
  - name: creative
    description: Creative Intelligence Engine
  - name: MarketplaceIntelligence
    description: Marketplace Intelligence Engine — listing performance and strategy
  - name: gm
    description: AI General Manager — pre-publish coaching and what-if analysis
  - name: workers
    description: DealerPilot AI Worker Framework — scheduled agents, manual triggers, System Timeline
paths:
  /gm/analyze:
    post:
      operationId: gmAnalyzeVehicle
      tags: [gm]
      summary: AI GM pre-publish analysis
      description: |
        Calls OpenAI to reason over real vehicle data and returns a GM-style
        recommendation — why publish, risk warnings, alternatives, ad angle,
        language recommendation, and expected impact. OpenAI never invents data;
        all inputs come from the Opportunity Engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmAnalyzeRequest"
      responses:
        "200":
          description: GM analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmAnalysisResult"
        "422":
          description: Missing required vehicle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gm/decisions:
    post:
      operationId: recordGmDecision
      tags: [gm]
      summary: Record a GM Coach decision outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordGmDecisionRequest"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmDecisionEntry"
    get:
      operationId: listGmDecisions
      tags: [gm]
      summary: List recent GM Coach decision log entries
      parameters:
        - name: vehicleId
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Decision log entries
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/GmDecisionEntry"

  /gm/whatif:
    post:
      operationId: gmWhatIf
      tags: [gm]
      summary: AI GM what-if price analysis
      description: |
        Given a vehicle and a hypothetical price delta, returns a GM-style
        prediction of the impact on conversations, appointments, and sale
        probability. All deterministic from opportunity data; no OpenAI call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmWhatIfRequest"
      responses:
        "200":
          description: What-if result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmWhatIfResult"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dealers:
    get:
      operationId: listDealers
      tags: [dealers]
      summary: List dealers
      responses:
        "200":
          description: List of dealers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerList"
  /dealers/{id}:
    get:
      operationId: getDealer
      tags: [dealers]
      summary: Get a dealer with feed summary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The dealer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDealer
      tags: [dealers]
      summary: Update dealer fields (incl. XML feed URL)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerUpdate"
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dealer"
  /dealers/{id}/sync:
    post:
      operationId: syncDealerFeed
      tags: [dealers]
      summary: Sync the dealer's XML feed (parse, import, delta-detect)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feed run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRun"
        "400":
          description: Sync failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRun"
  /dealers/{id}/feed-runs:
    get:
      operationId: listFeedRuns
      tags: [dealers]
      summary: List recent feed runs for a dealer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feed runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedRunList"

  /inventory/health:
    get:
      operationId: getInventoryHealth
      tags: [inventory]
      summary: Feed health report — metrics, scores, and sync status
      responses:
        "200":
          description: Feed health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedHealthReport"

  /channels/meta-catalog/diagnostics:
    get:
      operationId: getMetaCatalogDiagnostics
      tags: [inventory]
      summary: Validate all active inventory against Meta catalog requirements
      responses:
        "200":
          description: Meta catalog diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDiagnostics"

  /channels/meta-catalog/validate:
    get:
      operationId: validateMetaCatalogFeed
      tags: [inventory]
      summary: Meta Automotive feed validation — per-field coverage for all active vehicles
      responses:
        "200":
          description: Meta Automotive feed validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaDiagnostics"

  /channels/meta-catalog/schema-audit:
    get:
      operationId: auditMetaCatalogSchema
      tags: [inventory]
      summary: Meta Automotive schema compliance audit — verifies every required XML tag matches the official spec
      responses:
        "200":
          description: Schema audit result with per-tag compliance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaAuditResult"

  /channels/meta-catalog/validate-meta:
    get:
      operationId: validateMetaFields
      tags: [inventory]
      summary: Detailed Meta Automotive field validation — missing fields, invalid values, invalid URLs, duplicate IDs, compatibility score
      responses:
        "200":
          description: Comprehensive Meta Automotive field validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateMetaResult"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [inventory]
      summary: List vehicles with search, filter, and sort
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by VIN, stock number, make, or model
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by vehicle status
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, price_high, price_low, mileage_low]
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Filter by lot location (e.g. Manassas, Manassas)
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleList"
  /vehicles/stats:
    get:
      operationId: getVehicleStats
      tags: [inventory]
      summary: Inventory counts by status
      parameters:
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Filter by lot location (e.g. Manassas, Manassas)
      responses:
        "200":
          description: Inventory stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStats"
  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [inventory]
      summary: Vehicle detail with images, changes, and raw data
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vehicles/{id}/status:
    patch:
      operationId: updateVehicleStatus
      tags: [inventory]
      summary: Update a vehicle's status (e.g. Ready to Publish, Archived)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleStatusUpdate"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/bulk:
    post:
      operationId: bulkVehicleAction
      tags: [inventory]
      summary: Bulk status update for multiple vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkVehicleActionRequest"
      responses:
        "200":
          description: Number of updated vehicles
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }

  /connection-center:
    get:
      operationId: getConnectionStatus
      tags: [connection]
      summary: Status of all integrations and services
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"

  /extension/heartbeat:
    post:
      operationId: recordHeartbeat
      tags: [extension]
      summary: Record an extension heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionConnection"
  /extension/test-listing:
    get:
      operationId: getTestListing
      tags: [extension]
      summary: Get the test vehicle listing
      description: Returns the static test listing the Chrome extension fills into Marketplace.
      responses:
        "200":
          description: The test listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestListing"
  /extension/message-context:
    post:
      operationId: createMessageContext
      tags: [extension]
      summary: Submit Messenger chat text and get an AI-style reply
      description: Receives visible Messenger chat text, returns a suggested reply, and saves a test lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageContextInput"
      responses:
        "200":
          description: Suggested reply and saved lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageContextResult"
  /extension/leads:
    get:
      operationId: getLeads
      tags: [extension]
      summary: List saved test leads
      description: Returns all saved test leads, newest first.
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadList"

  /extension/connect-marketplace:
    post:
      operationId: connectMarketplace
      tags: [extension]
      summary: Request the extension to open Facebook and verify Marketplace access
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectMarketplaceInput"
      responses:
        "200":
          description: Request queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMarketplaceResult"

  /extension/connect-status:
    get:
      operationId: getExtensionConnectStatus
      tags: [extension]
      summary: Poll current connect-marketplace request and session state
      responses:
        "200":
          description: Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionConnectStatus"

  /extension/session-report:
    post:
      operationId: reportExtensionSession
      tags: [extension]
      summary: Extension reports back Facebook session and Marketplace access state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionReportInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReportResult"

  /listings:
    get:
      operationId: listListingWorkspaces
      tags: [listings]
      summary: List one Listing Workspace per vehicle
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by VIN, stock number, make, or model
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by draft/listing status
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Filter by lot location (e.g. Manassas, Manassas)
      responses:
        "200":
          description: Listing workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingWorkspaceList"
  /listings/{vehicleId}/mark-published:
    post:
      operationId: markListingPublished
      tags: [listings]
      summary: Operator manually marks a listing as published (after publishing on Facebook)
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                marketplaceUrl: { type: string, format: uri }
                publishedByExtensionId: { type: string }
      responses:
        "200":
          description: Listing marked as published
          content:
            application/json:
              schema:
                type: object
                required: [success, vehicleId, publishedAt]
                properties:
                  success: { type: boolean }
                  vehicleId: { type: integer }
                  publishedAt: { type: string, format: date-time }

  /listings/{id}:
    get:
      operationId: getListingDetail
      tags: [listings]
      summary: Listing detail for a vehicle (current version, all versions, history)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Vehicle id
      responses:
        "200":
          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listings/{id}/generate:
    post:
      operationId: generateListing
      tags: [listings]
      summary: Generate a new AI listing version for a vehicle (never overwrites)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Vehicle id
      responses:
        "200":
          description: Newly generated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}:
    patch:
      operationId: updateListingVersion
      tags: [listings]
      summary: Edit fields of a listing version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionUpdate"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}/status:
    patch:
      operationId: updateListingVersionStatus
      tags: [listings]
      summary: Move a listing version through its lifecycle (Draft, Ready for Review, Approved)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingVersionStatusUpdate"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingVersion"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /listing-versions/{id}/queue:
    post:
      operationId: queueListingVersion
      tags: [publishing]
      summary: Approve and queue a listing version for publishing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Listing version id
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueListingInput"
      responses:
        "200":
          description: Created publishing job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publishing/jobs:
    get:
      operationId: listPublishingJobs
      tags: [publishing]
      summary: List publishing jobs for the queue UI
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: Filter by job status
        - name: location
          in: query
          required: false
          schema: { type: string }
          description: Filter by lot location (e.g. Manassas, Manassas)
      responses:
        "200":
          description: Publishing jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobList"
  /publishing/jobs/publish-now:
    post:
      operationId: publishNow
      tags: [publishing]
      summary: Create a high-priority Controlled-mode job for a single vehicle (Publish Now)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId]
              properties:
                vehicleId:
                  type: integer
      responses:
        "201":
          description: New job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: integer
                  job:
                    $ref: "#/components/schemas/PublishingJob"
                  resumed:
                    type: boolean
                    description: Always false for new jobs
                  message:
                    type: string
        "200":
          description: Existing active job returned (idempotent resume — no duplicate created)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: integer
                  job:
                    $ref: "#/components/schemas/PublishingJob"
                  resumed:
                    type: boolean
                    description: true when returning an existing active job instead of creating a new one
                  message:
                    type: string
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publishing/jobs/next:
    get:
      operationId: getNextPublishingJob
      tags: [publishing]
      summary: Get the next claimable publishing job (for the Chrome extension)
      responses:
        "200":
          description: Next job, or null when the queue is empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextPublishingJob"
  /publishing/jobs/{id}/payload:
    get:
      operationId: getPublishingJobPayload
      tags: [publishing]
      summary: Full Marketplace form-fill data for a job (for the Chrome extension)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job plus the data needed to fill the Marketplace listing form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJobPayload"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /publishing/jobs/{id}/claim:
    post:
      operationId: claimPublishingJob
      tags: [publishing]
      summary: Claim a job for an extension instance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobInput"
      responses:
        "200":
          description: Claimed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /publishing/jobs/{id}/complete:
    post:
      operationId: completePublishingJob
      tags: [publishing]
      summary: Mark a job published
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobInput"
      responses:
        "200":
          description: Completed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /publishing/jobs/{id}/fail:
    post:
      operationId: failPublishingJob
      tags: [publishing]
      summary: Mark a job failed (eligible for retry)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailJobInput"
      responses:
        "200":
          description: Failed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publishing/jobs/{id}/retry:
    post:
      operationId: retryPublishingJob
      tags: [publishing]
      summary: Manually reset a Failed or Retry job back to Queued (operator action)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job reset to Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: "#/components/schemas/PublishingJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job is not in a retryable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publishing/jobs/{id}/event:
    post:
      operationId: addPublishingJobEvent
      tags: [publishing]
      summary: Record a progress event for a publishing job (from the Chrome extension)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
