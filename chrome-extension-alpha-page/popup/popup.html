<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealerPilot Page Publisher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">DP</div>
      <div>
        <h1>DealerPilot Page Publisher</h1>
        <p>Human-reviewed Facebook Page drafts</p>
      </div>
    </header>

    <section>
      <label for="backendUrl">DealerPilot backend</label>
      <input id="backendUrl" type="url" />
      <button id="saveBackend" class="secondary">Save backend</button>
    </section>

    <section>
      <label for="search">Find vehicle</label>
      <input id="search" type="search" placeholder="VIN, stock, make, model, id" />
      <button id="loadVehicles" class="secondary">Load vehicles</button>
      <select id="vehicleSelect"></select>
      <button id="prepareDraft">Prepare Business Suite draft</button>
    </section>

    <section class="note">
      This extension never clicks Publish. Review the Business Suite draft manually.
    </section>

    <section class="debug-card">
      <h2>Alpha Debugger</h2>
      <div class="debug-row">
        <span class="debug-label">Backend</span>
        <span class="debug-value" id="dbg-backend">-</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Target</span>
        <span class="debug-value" id="dbg-target">-</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Vehicle</span>
        <span class="debug-value" id="dbg-vehicle">-</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Photos</span>
        <span class="debug-value" id="dbg-photos">-</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Stage</span>
        <span class="debug-value" id="dbg-stage">Never</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Human Review</span>
        <span class="debug-value ok" id="dbg-human">Required</span>
      </div>
      <div class="debug-row">
        <span class="debug-label">Last Error</span>
        <span class="debug-value" id="dbg-error">None</span>
      </div>
      <button id="reloadDebug" class="secondary">Reload debugger</button>
      <button id="showJsonDebug" class="secondary">Show JSON debugger</button>
      <button id="showScreenshot" class="secondary">View composer screenshot</button>
      <pre id="jsonDebug">Loading...</pre>
    </section>

    <div id="status"></div>
    <script src="../src/shared/apiClient.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
