<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace AI</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b1f3a;
        color: #f2f5fa;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { font-size: 12px; color: #9fb3cc; margin: 0 0 12px; }
      label { display: block; font-size: 12px; margin-bottom: 4px; color: #cdd9ea; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #1c3a63;
        background: #08182d;
        color: #f2f5fa;
        font-size: 12px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 8px;
        background: #e10600;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
      .ok { color: #6fe39f; }
      .err { color: #ff8a7a; }
    </style>
  </head>
  <body>
    <h1>Marketplace AI</h1>
    <p>Backend URL the extension talks to.</p>
    <label for="url">Backend URL</label>
    <input id="url" type="url" placeholder="https://your-app.replit.dev" />
    <button id="save">Save & Test Connection</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
